<div class="container-fluid">
    <div class="row g-3 mb-3">
        <div class="col-12 col-md-4">
            <div class="card h-100 bg-body border-secondary-subtle weather-hover-card">
                <div class="card-body d-flex flex-column justify-content-center">
                    <h6 class="card-title text-body-secondary text-uppercase fw-bold small mb-1">Location</h6>
                    <h5 class="text-body mb-2" id="locationStr">Baja</h5>
                    <button class="btn btn-outline-secondary btn-sm mt-2 align-self-start" data-bs-toggle="modal" data-bs-target="#locationModal">
                        <i class="bi bi-geo-alt"></i> Change Location
                    </button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4">
            <div class="card h-100 bg-body border-secondary-subtle weather-hover-card">
                <div class="card-body">
                    <h6 class="card-title text-body-secondary text-uppercase fw-bold small mb-1">Today's Wind</h6>
                    <div class="d-flex align-items-center mt-2">
                        <i class="bi bi-wind text-primary fs-2 me-2"></i>
                        <div>
                            <span class="fs-4 fw-bold text-body" id="windSpeedValue">--</span>
                            <span class="text-body-secondary small">km/h</span>
                            <div class="text-body-secondary small mt-1"><i class="bi bi-compass"></i> <span id="windDirectionValue">--</span> Direction</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4">
            <div class="card h-100 bg-body border-secondary-subtle weather-hover-card">
                <div class="card-body">
                    <h6 class="card-title text-body-secondary text-uppercase fw-bold small mb-1">Atmosphere</h6>
                    <div class="row text-center mt-2">
                        <div class="col-4 border-end border-secondary-subtle">
                            <i class="bi bi-droplet-half text-info fs-5"></i>
                            <div class="fw-bold text-body small mt-1"><span id="humidityValue">--</span>%</div>
                            <small class="text-body-secondary" style="font-size: 0.65rem;">Humidity</small>
                        </div>
                        <div class="col-4 border-end border-secondary-subtle">
                            <i class="bi bi-speedometer2 text-warning fs-5"></i>
                            <div class="fw-bold text-body small mt-1"><span id="pressureValue">--</span></div>
                            <small class="text-body-secondary" style="font-size: 0.65rem;">hPa</small>
                        </div>
                        <div class="col-4">
                            <i class="bi bi-sun text-danger fs-5"></i>
                            <div class="fw-bold text-body small mt-1"><span id="uvValue">--</span></div>
                            <small class="text-body-secondary" style="font-size: 0.65rem;">UV Idx</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h6 class="text-body fw-bold mb-2">7 Day Forecast</h6>
    <div id="forecast-container" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-7 g-2">
    </div>

    <div class="row g-3 my-3">
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header py-3 d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-1">
                    <h5 class="mb-0">Temperature</h5>
                    <small id="temperatureAverage" class="text-body-secondary">Average temperatures</small>
                </div>
                <div class="card-body">
                    <div class="chart-box weather-chart-box">
                        <canvas id="weatherTempChart" role="img" aria-label="Minimum and maximum temperatures for the next 7 days"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header py-3 d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-1">
                    <h5 class="mb-0">Precipitation &amp; Wind</h5>
                    <small id="precipitationWindAverage" class="text-body-secondary">Average precipitation and wind</small>
                </div>
                <div class="card-body">
                    <div class="chart-box weather-chart-box">
                        <canvas id="weatherOtherChart" role="img" aria-label="Precipitation amount and wind speed for the next 7 days"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="calendar" class="mt-4"></div>
</div>

<div class="modal fade" id="locationModal" tabindex="-1" aria-labelledby="locationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-body border-secondary-subtle">
            <div class="modal-header">
                <h5 class="modal-title text-body" id="locationModalLabel">Change Location</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="enteredLocation" class="form-control" placeholder="Enter city or zip code">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="setLocationStr()" data-bs-dismiss="modal">Save Changes</button>
            </div>
        </div>
    </div>
</div>
