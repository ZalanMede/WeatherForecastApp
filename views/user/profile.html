<h3>My Profile</h3>
<hr>

<div class="row">
    <div class="col-lg-6">
        <h6><i class="bi bi-person-fill"></i> &nbsp;Update Profile</h6>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="name" placeholder="">
            <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="">
            <label for="floatingInput">Email address</label>
        </div>

        <button type="button" class="btn btn-primary mb-3" onclick="updateProfile()"><i class="bi bi-arrow-clockwise"></i> &nbsp;Update Profile</button>
    </div>

    <div class="col-lg-6">
        <h6><i class="bi bi-key-fill"></i> &nbsp;Update Password</h6>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="oldpass" placeholder="Password">
            <label for="floatingPassword">Old Password</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="newpass" placeholder="Password">
            <label for="floatingPassword">New Password</label>
        </div>
            <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirm" placeholder="Password">
            <label for="floatingPassword">Confirm New Password</label>
        </div>

        <button type="button" class="btn btn-primary mb-3" onclick="updatePass()"><i class="bi bi-arrow-clockwise"></i> &nbsp;Update Password</button>
    </div>
</div>
