<div class="col-lg-6 offset-lg-3">
    <h3>Registration</h3>
    <hr>

    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="name" placeholder="">
        <label for="floatingInput">Username</label>
    </div>
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="">
        <label for="floatingInput">Email address</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password">
        <label for="floatingPassword">Password</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="confirm" placeholder="Password">
        <label for="floatingPassword">Confirm Password</label>
    </div>

    <button type="button" class="btn btn-primary mb-3" onclick="registration()"><i class="bi bi-person-fill-add"></i> &nbsp;Registration</button>

    <p>Already registered? Please <a href="#" onclick="navigate('login','user')">Sign in!</a></p>
</div>
