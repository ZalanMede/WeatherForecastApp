<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="shortcut icon" href="assets/img/cloud.svg" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-body text-body">
    <header class="app-header d-flex align-items-center px-3 bg-body border-bottom border-secondary-subtle shadow-sm">
        <span class="fw-bold text-body">Simple Weather App</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="text-body fw-semibold small">Gazsi</span>
            <button class="btn btn-outline-secondary btn-sm" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </header>

    <div class="content-wrapper">

        <nav class="sidebar bg-body border-end border-secondary-subtle d-flex flex-column pt-2">
            <ul class="nav flex-column mb-auto w-100">

                <!-- Everyone can see -->
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-house-door"></i>
                        <span class="nav-text">Home</span>
                    </a>
                </li>
                <!-- Guest/Logged Out Only -->
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span class="nav-text">Login</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-person-fill-add"></i>
                        <span class="nav-text">Register</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-cloud-fill"></i>
                        <span class="nav-text">Guest Weather</span>
                    </a>
                </li>

                <!-- User Only -->
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-cloud-fill"></i>
                        <span class="nav-text">User Weather</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-person-fill-gear"></i>
                        <span class="nav-text">Edit Profile</span>
                    </a>
                </li>

                <!-- Admin Only -->
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-cloud-fill"></i>
                        <span class="nav-text">Admin Weather</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-cloud-arrow-up-fill"></i>
                        <span class="nav-text">Manage Forecasts</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-body" href="#">
                        <i class="bi bi-people-fill"></i>
                        <span class="nav-text">Manage Users</span>
                    </a>
                </li>
            </ul>
            <div class="w-100 p-3 d-flex justify-content-center mb-2">
                <button id="themeToggleBtn" class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="bi bi-moon-fill"></i>
                </button>
            </div>
        </nav>

        <main class="p-3 p-md-4 bg-body-tertiary"></main>
    </div>

    <footer class="app-footer d-flex align-items-center justify-content-center bg-body border-top border-secondary-subtle">
        <small class="text-body-secondary fw-light">Bajai SZC Türr István Technikum - Szoft 2026</small>
    </footer>

    <div class="modal fade" id="locationModal" tabindex="-1" aria-labelledby="locationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-body border-secondary-subtle">
                <div class="modal-header">
                    <h5 class="modal-title text-body" id="locationModalLabel">Change Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Enter city or zip code">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/moment.js"></script>

    <!-- Controllers -->
    <script src="controllers/weatherCtrl.js"></script>

    <!-- App.js -->
    <script src="assets/js/app.js"></script>
</body>
</html>
